<!DOCTYPE html>
<html>
<head>
    <title>Administrator Login - Cyberbullying Detection System</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        text-align: center;
        padding-top: 80px;
    }
    .container {
        width: 400px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }
    h1 {
        color: #333;
    }
    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }
    button {
        margin-top: 15px;
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #333;
        color: white;
    }
    button:hover {
        background-color: #555;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Administrator Login</h1>
    <p>Login to access the administrator area.</p>
    <form action="/login" method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required>
        <br>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required>
        <br>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
