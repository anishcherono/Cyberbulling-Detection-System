{% extends "base.html" %}
{% block title %}Student Login - Nish Institution{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body %}
<main class="auth-page">
    <header class="auth-brand">
        <h1>Nish Institution</h1>
        <p>Cyberbullying Detection and Prevention System</p>
    </header>
    <section class="auth-panel">
        <h2>Student login</h2>
        <form method="POST" action="/student-login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="identifier">Institution email</label>
            <input id="identifier" type="email" name="identifier" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="auth-link"><a href="/">Back to home</a></p>
        <p class="auth-link"><a href="/student-signup">Create a student account</a></p>
    </section>
</main>
{% endblock %}
