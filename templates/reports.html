<!DOCTYPE html>
<html>
<head>

    <title>Reports - Cyberbullying Detection System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        .status {
            font-weight: bold;
        }

        select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 8px;
            padding: 8px 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>Cyberbullying Detection System</h1>

        <p>Reports</p>

    </div>


    <div class="container">


        <div class="section">

            <h2>Reported Messages</h2>


            <table>

                <tr>

                    <th>Report ID</th>

                    <th>Message ID</th>

                    <th>Reported By</th>

                    <th>Reason</th>

                    <th>Date Reported</th>

                    <th>Action Taken</th>

                    <th>Status</th>

                    <th>Update</th>

                </tr>


                {% for report in reports %}

                <tr>

                    <td>
                        {{ report[0] }}
                    </td>

                    <td>
                        {{ report[1] }}
                    </td>

                    <td>
                        {{ report[2] }}
                    </td>

                    <td>
                        {{ report[3] }}
                    </td>

                    <td>
                        {{ report[4] }}
                    </td>


                    <td>

                        <form
                            action="/update-report/{{ report[0] }}"
                            method="POST"
                        >

                            <select
                                name="action_taken"
                                required
                            >

                                <option value="">
                                    Select Action
                                </option>

                                <option
                                    value="Message reviewed"
                                    {% if report[5] == "Message reviewed" %}
                                    selected
                                    {% endif %}
                                >
                                    Message reviewed
                                </option>

                                <option
                                    value="Warning issued"
                                    {% if report[5] == "Warning issued" %}
                                    selected
                                    {% endif %}
                                >
                                    Warning issued
                                </option>

                                <option
                                    value="User contacted"
                                    {% if report[5] == "User contacted" %}
                                    selected
                                    {% endif %}
                                >
                                    User contacted
                                </option>

                                <option
                                    value="No action required"
                                    {% if report[5] == "No action required" %}
                                    selected
                                    {% endif %}
                                >
                                    No action required
                                </option>

                            </select>

                    </td>


                    <td>

                            <select
                                name="status"
                                required
                            >

                                <option value="">
                                    Select Status
                                </option>

                                <option
                                    value="Reviewed"
                                    {% if report[6] == "Reviewed" %}
                                    selected
                                    {% endif %}
                                >
                                    Reviewed
                                </option>

                                <option
                                    value="Resolved"
                                    {% if report[6] == "Resolved" %}
                                    selected
                                    {% endif %}
                                >
                                    Resolved
                                </option>

                            </select>

                    </td>


                    <td>

                            <button type="submit">
                                Update Report
                            </button>

                        </form>

                    </td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </div>


</body>
</html>
